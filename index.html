<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Default Title & Description (overridden per-page by SEOHead) ── -->
    <title>Minderfly — We Build & Scale Startups Worldwide</title>
    <meta name="description" content="Turn your startup idea into a real product. Minderfly builds software used in 100+ countries. Desktop apps, mobile apps, web apps, and VS Code extensions. 3-day free trials." />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1a73e8" />

    <!-- ── Open Graph (default, overridden by SEOHead per page) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Minderfly" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Minderfly — We Build & Scale Startups Worldwide" />
    <meta property="og:description" content="Turn your startup idea into a real product. Minderfly builds software used in 100+ countries." />
    <meta property="og:image" content="https://minderfly.com/og-image.png" />
    <meta property="og:url" content="https://minderfly.com/" />

    <!-- ── Twitter Card (default) ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@minderfly" />
    <meta name="twitter:title" content="Minderfly — We Build & Scale Startups Worldwide" />
    <meta name="twitter:description" content="Turn your startup idea into a real product. Minderfly builds software used in 100+ countries." />
    <meta name="twitter:image" content="https://minderfly.com/og-image.png" />

    <!-- ── Canonical (default) ── -->
    <link rel="canonical" href="https://minderfly.com/" />

    <!-- ── Robots ── -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Minderfly" />

    <!-- ── Fonts ── -->
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Google+Sans:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />

    <!-- ── Default Organization JSON-LD ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Minderfly",
      "url": "https://minderfly.com",
      "logo": "https://minderfly.com/favicon.svg",
      "description": "Minderfly is a software studio that builds and scales startup products used in 100+ countries worldwide.",
      "foundingDate": "2021",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://minderfly.com/contact"
      },
      "sameAs": []
    }
    </script>

    <!-- ── Website with SearchAction JSON-LD ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Minderfly",
      "url": "https://minderfly.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://minderfly.com/all-products?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
